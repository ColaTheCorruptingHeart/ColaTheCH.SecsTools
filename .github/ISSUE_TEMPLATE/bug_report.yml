name: Bug Report
description: 报告一个可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈。请尽量提供最小复现信息，并确认内容中不包含敏感日志、账号、令牌或客户数据。

  - type: input
    id: tool
    attributes:
      label: 相关工具
      description: 问题发生在哪个工具页面或功能点
      placeholder: 例如：SECS 日志时间线分析 / RecipeBody 分析器
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要描述你遇到的问题
      placeholder: 实际发生了什么，为什么这不符合预期
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出复现方法
      placeholder: |
        1. 打开...
        2. 输入...
        3. 点击...
        4. 观察到...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 你期望看到什么结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际输出、报错或异常表现
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: 最小复现样例
      description: 可粘贴脱敏后的输入样本、日志片段或截图说明
      render: text

  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 浏览器、系统、Node.js 版本、部署方式等
      placeholder: 例如：Windows 11 + Edge 136 / Node.js 22.12 / 本地 dev

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复问题
          required: true
        - label: 我已确认示例中不包含敏感信息
          required: true